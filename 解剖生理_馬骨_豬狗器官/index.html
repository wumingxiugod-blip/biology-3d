<script>
/**
 * 獸醫解剖 3D 核心應用程式
 * 整合：馬骨骼系統、狗主要內臟器官、豬特徵消化與實質器官
 */

const $ = id => document.getElementById(id);
const cvBox = $('cv');
const SCENES = [];
const CUR = { parts: [], root: null, tick: null };
let renderer, scene3, camera, controls, curIdx = -1, selected = null, labelEls = [], keyLight, XRAY = false, fly = null;

// 音效引擎
class SoundEngine {
  constructor() { this.ctx = null; }
  init() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  }
  playClick() {
    this.init(); if (!this.ctx) return;
    const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
    osc.type = 'sine'; osc.frequency.setValueAtTime(800, this.ctx.currentTime);
    g.gain.setValueAtTime(0.08, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.06);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.07);
  }
  playRight() {
    this.init(); if (!this.ctx) return;
    const now = this.ctx.currentTime;
    [523.25, 659.25, 783.99].forEach((f, idx) => {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = 'triangle'; o.frequency.setValueAtTime(f, now + idx * 0.08);
      g.gain.setValueAtTime(0.12, now + idx * 0.08);
      g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.25);
      o.connect(g); g.connect(this.ctx.destination);
      o.start(now + idx * 0.08); o.stop(now + idx * 0.08 + 0.26);
    });
  }
  playWrong() {
    this.init(); if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(220, this.ctx.currentTime);
    o.frequency.linearRampToValueAtTime(146.8, this.ctx.currentTime + 0.25);
    g.gain.setValueAtTime(0.15, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.28);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + 0.29);
  }
}
const SOUND = new SoundEngine();

// 向量與輔助
const V = (x, y, z) => new THREE.Vector3(x, y, z);

// 簡單 OBJ パーサー (OBJLoader CDN がオフラインの場合のフォールバック)
function parseOBJFallback(text) {
  const lines = text.split('\n');
  const group = new THREE.Group();
  const positions = [];
  const normals = [];
  let curMeshName = 'default';
  let curVertices = [];
  let curNormals = [];

  function commitMesh() {
    if (curVertices.length === 0) return;
    const geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.Float32BufferAttribute(curVertices, 3));
    if (curNormals.length === curVertices.length) {
      geom.setAttribute('normal', new THREE.Float32BufferAttribute(curNormals, 3));
    } else {
      geom.computeVertexNormals();
    }
    const mesh = new THREE.Mesh(geom, new THREE.MeshLambertMaterial({ color: 0xddccbb }));
    mesh.name = curMeshName;
    group.add(mesh);
    curVertices = [];
    curNormals = [];
  }

  for (let i = 0; i < lines.length; i++) {
    const l = lines[i].trim();
    if (!l || l.startsWith('#')) continue;
    const parts = l.split(/\s+/);
    if (parts[0] === 'v') {
      positions.push([parseFloat(parts[1]), parseFloat(parts[2]), parseFloat(parts[3])]);
    } else if (parts[0] === 'vn') {
      normals.push([parseFloat(parts[1]), parseFloat(parts[2]), parseFloat(parts[3])]);
    } else if (parts[0] === 'o' || parts[0] === 'g') {
      commitMesh();
      curMeshName = parts[1] || 'obj_' + group.children.length;
    } else if (parts[0] === 'f') {
      const vIdx = [], nIdx = [];
      for (let j = 1; j < parts.length; j++) {
        const segs = parts[j].split('/');
        vIdx.push(parseInt(segs[0], 10) - 1);
        nIdx.push(segs.length >= 3 && segs[2] ? parseInt(segs[2], 10) - 1 : -1);
      }
      for (let j = 1; j < vIdx.length - 1; j++) {
        const i0 = vIdx[0], i1 = vIdx[j], i2 = vIdx[j + 1];
        if (positions[i0] && positions[i1] && positions[i2]) {
          curVertices.push(...positions[i0], ...positions[i1], ...positions[i2]);
          const n0 = nIdx[0], n1 = nIdx[j], n2 = nIdx[j + 1];
          if (normals[n0] && normals[n1] && normals[n2]) {
            curNormals.push(...normals[n0], ...normals[n1], ...normals[n2]);
          }
        }
      }
    }
  }
  commitMesh();
  return group;
}

// 程序化豬肝多角形小葉網紋貼圖（Voronoi 多角形小葉＋淺色小葉間結締組織溝線，100% 離線）
let _pigLiverTex = null;
function getPigLiverLobuleTexture() {
  if (_pigLiverTex) return _pigLiverTex;
  const N = 256;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = N;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(N, N);
  // 產生可無縫平鋪的規則微擾 Voronoi 中心點（約 10x10 多角形肝小葉）
  const G = 10, seeds = [];
  let s = 1337;
  const rnd = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
  for (let gy = 0; gy < G; gy++) {
    for (let gx = 0; gx < G; gx++) {
      seeds.push([(gx + 0.18 + 0.64 * rnd()) / G, (gy + 0.18 + 0.64 * rnd()) / G]);
    }
  }
  for (let y = 0; y < N; y++) {
    const v = y / N;
    for (let x = 0; x < N; x++) {
      const u = x / N;
      const gx0 = Math.floor(u * G), gy0 = Math.floor(v * G);
      let d1 = 9, d2 = 9;
      for (let oy = -1; oy <= 1; oy++) {
        for (let ox = -1; ox <= 1; ox++) {
          const sx = ((gx0 + ox) % G + G) % G;
          const sy = ((gy0 + oy) % G + G) % G;
          const pt = seeds[sy * G + sx];
          let dx = u - pt[0]; if (dx > 0.5) dx -= 1; else if (dx < -0.5) dx += 1;
          let dy = v - pt[1]; if (dy > 0.5) dy -= 1; else if (dy < -0.5) dy += 1;
          const d = Math.hypot(dx, dy);
          if (d < d1) { d2 = d1; d1 = d; }
          else if (d < d2) { d2 = d; }
        }
      }
      // 小葉間結締組織邊界（d2 - d1 趨近 0 時為淺粉白網紋，中央微暗呈中央靜脈）
      const edge = Math.max(0, 1 - (d2 - d1) * G * 6.5);
      const centerDot = Math.max(0, 1 - d1 * G * 7.0) * 0.25;
      const idx = (y * N + x) * 4;
      const r = Math.min(255, Math.round(145 * (1 - centerDot) + edge * 85));
      const g = Math.min(255, Math.round(38 * (1 - centerDot) + edge * 145));
      const b = Math.min(255, Math.round(52 * (1 - centerDot) + edge * 135));
      img.data[idx] = r; img.data[idx + 1] = g; img.data[idx + 2] = b; img.data[idx + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(3, 3);
  if (THREE.sRGBEncoding) tex.encoding = THREE.sRGBEncoding;
  _pigLiverTex = tex;
  return tex;
}

function ensureSphericalUVs(geom) {
  if (!geom || !geom.attributes.position) return;
  geom.computeBoundingBox();
  const bb = geom.boundingBox;
  const cx = (bb.min.x + bb.max.x) * 0.5;
  const cy = (bb.min.y + bb.max.y) * 0.5;
  const cz = (bb.min.z + bb.max.z) * 0.5;
  const pos = geom.attributes.position;
  const uvs = new Float32Array(pos.count * 2);
  for (let i = 0; i < pos.count; i++) {
    const dx = pos.getX(i) - cx, dy = pos.getY(i) - cy, dz = pos.getZ(i) - cz;
    const len = Math.hypot(dx, dy, dz) || 1;
    uvs[i * 2] = 0.5 + Math.atan2(dz, dx) / (2 * Math.PI);
    uvs[i * 2 + 1] = 0.5 - Math.asin(Math.max(-1, Math.min(1, dy / len))) / Math.PI;
  }
  geom.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
}

function regPart(data) {
  // data: { id, zh, en, latin, grp, desc, clinical, meshes, anchor, anchorMeshes, anchorAt, visible, wall, wallO }
  const p = {
    id: data.id || ('part_' + CUR.parts.length),
    zh: data.zh,
    en: data.en || '',
    latin: data.latin || '',
    grp: data.grp || '一般構造',
    desc: data.desc || '',
    clinical: data.clinical || '',
    meshes: data.meshes || [],
    anchor: data.anchor || new THREE.Vector3(),
    anchorMeshes: data.anchorMeshes || null,
    anchorAt: data.anchorAt || null,
    visible: data.visible !== undefined ? data.visible : true,
    isKey: data.isKey !== undefined ? data.isKey : true,
    region: data.region || 'all',
    wall: !!data.wall,
    wallO: data.wallO || 0.95
  };
  p.meshes.forEach(m => {
    m.userData.part = p;
    if (m.material) {
      m.material.userData.baseO = m.material.opacity;
      m.material.userData.baseC = m.material.emissive ? m.material.emissive.getHex() : 0;
      m.material.userData.hex = m.material.color ? m.material.color.getHex() : 0xffffff;
    }
  });
  CUR.parts.push(p);
  return p;
}

  { id: "rib_17", names: ["coffin_hind_l_159", "coffin_hind_r_180"], region: "hind_pelvis", isKey: false, anchor: ["coffin_hind_l_159"], zh: "第 17 肋骨 (假肋)", en: "Rib 17 (False)", latin: "Costa 17", grp: "胸廓與肋骨 (18 對)", desc: "第 17 對肋骨（假肋／非胸骨肋）：弧度大而細長，遠端肋軟骨依序疊接構成肋弓。", clinical: "後段肋骨延伸至腹腔前部，保護肝臟、胃與脾臟。" },

  { id: "costal_cartilage", names: ["limb_bone_r_128", "limb_bone_l_129", "humerus_l_130", "humerus_r_131", "humerus_l_132", "humerus_r_133", "humerus_l_134", "humerus_r_135", "humerus_l_136", "humerus_r_137", "sternum_138", "ribs_r_139", "ribs_l_140", "ribs_r_141", "ribs_l_142", "ribs_r_143", "ribs_l_144"], region: "head_fore", isKey: true, anchor: ["ribs_l_144"], anchorAt: "bottom", zh: "肋軟骨與肋弓", en: "Costal Cartilages & Costal Arch", latin: "Cartilagines costales et arcus costalis", grp: "胸廓與肋骨 (18 對)", desc: "前 8 對接胸骨；後 10 對肋軟骨相互疊接形成彈性「肋弓（Costal arch）」。", clinical: "肋弓為腹部超音波與肝脾定位的體表邊界。" },
  { id: "sternum", names: ["limb_bone_mid_127"], region: "head_fore", isKey: true, anchorAt: "bottom", zh: "胸骨", en: "Sternum", latin: "Sternum", grp: "胸廓與肋骨 (18 對)", desc: "呈船形，由胸骨柄、7 節胸骨體與劍突軟骨構成，腹側具顯著胸骨嵴。", clinical: "胸骨體是成馬骨髓穿刺採樣的首選部位。" },
  { id: "scapula", names: ["scapula_l_74", "scapula_r_75"], region: "head_fore", isKey: true, anchor: ["scapula_l_74"], zh: "肩胛骨", en: "Scapula", latin: "Scapula", grp: "前肢承重系統", desc: "三角形扁平骨，肩胛岡無肩峰，背緣接寬大肩胛軟骨；馬無鎖骨，前肢由肌肉懸吊於胸壁。", clinical: "肩胛上神經繞行肩胛頸易因撞傷導致「肩萎縮（Sweeney）」。" },
  { id: "humerus", names: ["humerus_l_0", "humerus_r_1"], region: "head_fore", isKey: true, anchor: ["humerus_l_0"], zh: "肱骨", en: "Humerus", latin: "Humerus", grp: "前肢承重系統", desc: "粗短扭轉長骨，近端具馬特有之中間結節，將結節間溝分為雙溝容納肱二頭肌腱。", clinical: "肱二頭肌腱與結節間溝為前肢站立裝置關鍵，摩擦易致滑液囊炎。" },
  { id: "radius_ulna", names: ["radius_ulna_l_54", "radius_ulna_r_55"], region: "head_fore", isKey: true, anchor: ["radius_ulna_l_54"], zh: "橈骨與尺骨 (含鷹嘴)", en: "Radius & Ulna", latin: "Radius et ulna", grp: "前肢承重系統", desc: "橈骨粗大承重；尺骨近端形成高大鷹嘴（肘頭），骨幹遠端退化並與橈骨癒合，無法旋前旋後。", clinical: "鷹嘴骨折會使肱三頭肌失去支點，呈典型「掉肘（Dropped elbow）」步態。" },
  { id: "carpus_radial", names: ["radius_ulna_l_37", "radius_ulna_l_41", "radius_ulna_r_46", "radius_ulna_r_50"], region: "head_fore", isKey: false, anchor: ["radius_ulna_l_37"], zh: "橈腕骨 (近列內側)", en: "Radial Carpal Bone", latin: "Os carpi radiale", grp: "前肢承重系統", desc: "近列腕骨內側最大者，上接橈骨遠端內側關節面，下接第 2、3 腕骨。", clinical: "賽馬腕部過度伸展時，橈腕骨背遠緣是碎片骨折（Chip fracture）最常發生部位。" },
  { id: "carpus_intermediate", names: ["radius_ulna_l_36", "radius_ulna_r_45"], region: "head_fore", isKey: false, anchor: ["radius_ulna_l_36"], zh: "中間腕骨 (近列中央)", en: "Intermediate Carpal Bone", latin: "Os carpi intermedium", grp: "前肢承重系統", desc: "位於近列腕骨中央呈楔形（前寬後窄），上接橈骨遠端中央關節面，下接第三與第四腕骨。", clinical: "與橈腕骨同為賽馬腕關節背側碎片骨折（Chip fracture）最常發生的部位。" },
  { id: "carpus_ulnar", names: ["radius_ulna_l_40", "radius_ulna_r_49"], region: "head_fore", isKey: false, anchor: ["radius_ulna_l_40"], zh: "尺腕骨 (近列外側)", en: "Ulnar Carpal Bone", latin: "Os carpi ulnare", grp: "前肢承重系統", desc: "近列腕骨最外側且體積最小、形狀最不規則之短骨，上接橈骨外側、下接第四腕骨、掌側接副腕骨。", clinical: "掌側面具關節面與副腕骨相連，參與穩定腕關節外側柱。" },
  { id: "carpus_accessory", names: ["radius_ulna_l_44", "radius_ulna_r_53"], region: "head_fore", isKey: true, anchor: ["radius_ulna_l_44"], zh: "副腕骨 (腕後種子骨)", en: "Accessory Carpal Bone", latin: "Os carpi accessorium", grp: "前肢承重系統", desc: "位於近列腕骨掌側後方的圓盤狀骨（對應人類豌豆骨），不直接負重，圍成腕管供屈肌腱通過。", clinical: "提供腕屈肌槓桿支點；跌倒撞擊可能引起垂直面骨折。" },
  { id: "carpus_c2", names: ["carpal_l_39", "radius_ulna_l_43", "carpal_r_48", "radius_ulna_r_52"], region: "head_fore", isKey: false, anchor: ["carpal_l_39"], zh: "第二腕骨 (遠列內側)", en: "Second Carpal Bone (C2)", latin: "Os carpale secundum", grp: "前肢承重系統", desc: "遠列腕骨內側最小恆定骨（第 1 腕骨僅約半數馬匹存在），下接第二掌骨（內側夾骨）與第三掌骨。", clinical: "參與構成低活動度腕掌關節，分散內側壓力。" },
  { id: "carpus_c3", names: ["carpal_l_38", "carpal_r_47"], region: "head_fore", isKey: false, anchor: ["carpal_l_38"], zh: "第三腕骨 (遠列中央・最大)", en: "Third Carpal Bone (C3)", latin: "Os carpale tertium", grp: "前肢承重系統", desc: "占遠列腕骨約三分之二、為遠列最大骨，上接橈腕骨與中間腕骨，下幾乎完全直接承接第三掌骨（前大砲骨）。", clinical: "承受高速奔馳最強垂直壓應力，賽馬常見第三腕骨板狀骨折（Slab fracture）與軟骨下骨硬化。" },
  { id: "carpus_c4", names: ["carpal_l_42", "radius_ulna_r_51"], region: "head_fore", isKey: false, anchor: ["carpal_l_42"], zh: "第四腕骨 (遠列外側)", en: "Fourth Carpal Bone (C4)", latin: "Os carpale quartum", grp: "前肢承重系統", desc: "位於遠列腕骨外側呈楔形，上接中間腕骨與尺腕骨，下接第三掌骨外側及第四掌骨（外側夾骨）。", clinical: "中腕關節與腕掌關節囊常於第三、第四腕骨之間相通，關節內注射時具重要臨床意義。" },
  { id: "cannon_fore", names: ["cannon_fore_l_16", "cannon_fore_r_17"], region: "head_fore", isKey: true, anchor: ["cannon_fore_l_16"], zh: "前大砲骨 (第三掌骨) 與夾骨", en: "Fore Cannon (MC III) & Splint Bones", latin: "Os metacarpale III et II/IV", grp: "前肢承重系統", desc: "第三掌骨為前肢主要承重長骨；第二、第四掌骨退化為附於兩旁的「夾骨」。", clinical: "幼馬常見管骨膜炎（Bucked shins）；夾骨間韌帶骨化稱夾骨瘤（Splints）。" },
  { id: "pastern_fore", names: ["pastern_fore_l_23", "pastern_fore_r_25"], region: "head_fore", isKey: false, anchor: ["pastern_fore_l_23"], zh: "前肢第一指骨／繫骨 (P1)", en: "Fore Proximal Phalanx (Long Pastern, P1)", latin: "Phalanx proximalis (manus)", grp: "前肢承重系統", desc: "上接第三掌骨與近端種子骨成球節，下接冠骨成繫關節，斜向吸收著地衝擊。", clinical: "急停扭轉時近端矢狀溝易發生縱向劈裂骨折（Sagittal fracture）。" },
  { id: "coronet_fore", names: ["coronet_fore_l_22", "coronet_fore_r_24"], region: "head_fore", isKey: false, anchor: ["coronet_fore_l_22"], zh: "前肢第二指骨／冠骨 (P2)", en: "Fore Middle Phalanx (Short Pastern, P2)", latin: "Phalanx media (manus)", grp: "前肢承重系統", desc: "短柱狀第二指骨，遠端包埋於蹄冠內與蹄骨、舟骨構成蹄關節。", clinical: "繫關節退化性骨關節炎稱「高位環骨（High ringbone）」。" },
  { id: "coffin_fore", names: ["coffin_fore_l_26", "coronet_fore_r_27"], region: "head_fore", isKey: true, anchor: ["coffin_fore_l_26"], zh: "前肢第三指骨／蹄骨 (P3)", en: "Fore Distal Phalanx (Coffin Bone, P3)", latin: "Phalanx distalis / Os ungulare", grp: "前肢承重系統", desc: "半月圓錐形骨完全包覆於蹄匣內，由葉層懸吊承重，後方緊鄰遠端種子骨（舟骨）。", clinical: "蹄葉炎（Laminitis）與舟骨症為前蹄兩大致跛重症。" },
  { id: "pelvis", names: ["sacrum_95"], region: "hind_pelvis", isKey: true, zh: "骨盆 (髂骨・坐骨・恥骨)", en: "Pelvis (Os coxae)", latin: "Os coxae / Pelvis", grp: "後肢推進系統", desc: "由左右髖骨癒合而成，具髖結節（腰角）、薦結節、坐骨結節（臀角）與髖臼。", clinical: "髖結節撞擊骨折導致單側腰角塌陷，俗稱「掉胯（Knocked-down hip）」。" },
  { id: "femur", names: ["pelvis_l_2", "pelvis_r_3"], region: "hind_pelvis", isKey: true, anchor: ["pelvis_l_2"], zh: "股骨 (具第三轉子)", en: "Femur (with Third Trochanter)", latin: "Os femoris", grp: "後肢推進系統", desc: "全身最粗壯長骨，外側具馬科特徵性「第三轉子」，遠端內側滑車嵴特別粗大。", clinical: "內側滑車嵴供髕骨勾鎖，構成馬站立睡覺的靜止裝置核心。" },
  { id: "patella", names: ["femur_l_4", "femur_r_5"], region: "hind_pelvis", isKey: true, anchor: ["femur_l_4"], zh: "髕骨 (膝蓋骨)", en: "Patella", latin: "Patella", grp: "後肢推進系統", desc: "大型種子骨，經內、中、外三條髕直韌帶連接脛骨粗隆。", clinical: "內側髕直韌帶勾住股骨內側滑車嵴可鎖定膝關節；無法解鎖稱「髕骨上方固定」。" },
  { id: "tibia", names: ["tibia_fibula_l_8", "tibia_fibula_r_9"], region: "hind_pelvis", isKey: true, anchor: ["tibia_fibula_l_8"], zh: "脛骨", en: "Tibia", latin: "Tibia", grp: "後肢推進系統", desc: "小腿主要承重長骨，近端前方具脛骨粗隆，遠端斜向滑車與距骨嵌合。", clinical: "內側面無肌肉覆蓋，遭踢傷極易引發骨膜炎或開放性骨折。" },
  { id: "fibula", names: ["tibia_fibula_l_12", "tibia_fibula_r_13"], region: "hind_pelvis", isKey: true, anchor: ["tibia_fibula_l_12"], zh: "腓骨 (退化細骨)", en: "Fibula", latin: "Fibula", grp: "後肢推進系統", desc: "高度退化為外側細長骨針，遠端與脛骨癒合形成外踝。", clinical: "X 光判讀時須區分正常骨化分節與腓骨骨折。" },

function buildHorseScene(filterRegion = null) {
  let root = null;
  if (window.HORSE_OBJ_DATA) root = loadOBJString(window.HORSE_OBJ_DATA);
  if (!root || root.children.length === 0) root = buildFallbackHorse();

  if (window.HORSE_OBJ_DATA) root.rotation.y = Math.PI / 2;
  const box = new THREE.Box3().setFromObject(root);
  const center = new THREE.Vector3(); box.getCenter(center);
  const size = new THREE.Vector3(); box.getSize(size);
  const scale = 32 / (Math.max(size.x, size.y, size.z) || 1);
  root.scale.set(scale, scale, scale);
  root.position.sub(center.clone().multiplyScalar(scale));
  root.position.y += 1.0;
  CUR.root.add(root);

  const boneMat = new THREE.MeshLambertMaterial({ color: 0xe2d9cc });
  const byName = {};
  HORSE_GROUP_DEF.forEach(g => g.names.forEach(n => byName[n] = g.id));
  const buckets = {};
  HORSE_GROUP_DEF.forEach(g => buckets[g.id] = []);

  root.traverse(child => {
    if (!child.isMesh) return;
    child.material = boneMat.clone();
    const id = byName[child.name];
    if (id) buckets[id].push(child);
    else console.warn('未分類馬骨 mesh:', child.name);
  });

  HORSE_GROUP_DEF.forEach(g => {
    const meshes = buckets[g.id];
    if (!meshes.length) return;
    const anchorMeshes = g.anchor ? meshes.filter(m => g.anchor.includes(m.name)) : [];
    const vis = !filterRegion || g.region === filterRegion;
    regPart({
      id: g.id, zh: g.zh, en: g.en, latin: g.latin, grp: g.grp,
      desc: g.desc, clinical: g.clinical, meshes,
      anchorMeshes: anchorMeshes.length ? anchorMeshes : null,
      anchorAt: g.anchorAt, visible: vis,
      isKey: filterRegion ? (g.region === filterRegion && (g.isKey || /carpus_|tarsal_|cervical_c[1234567]|pastern_|coronet_|coffin_/.test(g.id))) : g.isKey,
      region: g.region
    });
  });
}

function toggleRegionVisibility(keepRegion) {
  const anyOtherHidden = CUR.parts.some(p => p.region !== keepRegion && !p.visible);
  CUR.parts.forEach(p => {
    if (p.region !== keepRegion) p.visible = anyOtherHidden;
  });
  rebuildList();
  refresh();
  SOUND.playClick();
}

/* =========================================================
   爆炸分解動畫 (Exploded View Animation)
   ========================================================= */
let isExploded = false;
function toggleExplode() {
  isExploded = !isExploded;
  const factor = isExploded ? 1.7 : 1.0;
  CUR.parts.forEach(p => {
    p.meshes.forEach(m => {
      if (!m.userData.origPos) m.userData.origPos = m.position.clone();
      const targetPos = isExploded
        ? m.userData.origPos.clone().multiplyScalar(factor).add(p.anchor.clone().multiplyScalar(0.45))
        : m.userData.origPos.clone();
      flyMesh(m, targetPos, 600);
    });
  });
  SOUND.playClick();
}

function flyMesh(mesh, targetPos, ms = 600) {
  const startPos = mesh.position.clone();
  const startTime = performance.now();
  function step() {
    const elapsed = performance.now() - startTime;
    const t = Math.min(1, elapsed / ms);
    const ease = t * t * (3 - 2 * t);
    mesh.position.lerpVectors(startPos, targetPos, ease);
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

      </div>
      <div class="quiz-row">
        <button id="quiz-hint" type="button" style="flex:1;background:#1e3a5f;color:#fde68a;border:1px solid #475569;border-radius:4px;padding:5px;cursor:pointer;font-size:12px;">💡 顯示提示</button>
        <button id="quiz-reveal" type="button" style="flex:1;background:#3b1d2a;color:#fca5a5;border:1px solid #7f1d1d;border-radius:4px;padding:5px;cursor:pointer;font-size:12px;">👁️ 直接看答案</button>
      </div>
      <div id="quiz-hint-box" style="display:none;font-size:12px;color:#fde68a;background:rgba(234,179,8,0.12);border-left:3px solid #eab308;padding:5px 8px;border-radius:4px;"></div>
      <div id="quiz-feedback"></div>
      <div style="margin-top:6px; font-size:12px; color:#9ca3af;">
        統計：答對 <strong>${QUIZ_STATE.score}</strong> / <strong>${QUIZ_STATE.total}</strong> 題 ｜ 🔥 連勝：<strong>${QUIZ_STATE.streak}</strong>
      </div>
    </div>
  `;

  const inputEl = $('quiz-ans');
  const submitBtn = $('quiz-sub');
  const hintBtn = $('quiz-hint');
  const revealBtn = $('quiz-reveal');

  const finishQuestion = (isCorrect, skipped = false) => {
    QUIZ_STATE.revealed = true;
    rebuildList();
    refresh();
    const fb = $('quiz-feedback');
    if (isCorrect) {
      fb.className = "quiz-res ok";
      fb.innerHTML = `🎉 <strong>答對了！</strong><br><strong>${picked.zh}</strong><br><small>${picked.en} (${picked.latin})</small><br>${picked.desc}${picked.clinical ? `<br><span style="color:#fde047;">💡 ${picked.clinical}</span>` : ''}`;
    } else {
      fb.className = "quiz-res err";
      fb.innerHTML = `${skipped ? '👁️ <strong>已揭曉答案</strong>' : '❌ <strong>答錯了，再接再厲！</strong>'}<br>正確答案：<strong>${picked.zh}</strong><br><small>${picked.en} (${picked.latin})</small><br>${picked.desc}${picked.clinical ? `<br><span style="color:#fde047;">💡 ${picked.clinical}</span>` : ''}`;
    }
    inputEl.disabled = true;
    hintBtn.disabled = true;
    revealBtn.disabled = true;
    submitBtn.textContent = "下一題 ▶";
    submitBtn.style.background = "#059669";
    submitBtn.onclick = () => startQuizQuestion();
  };

  const checkAns = () => {
    if (QUIZ_STATE.revealed) return;
    const raw = inputEl.value.trim().toLowerCase().replace(/\s+/g, '');
    if (!raw) return;
    QUIZ_STATE.total++;
    const zhNorm = picked.zh.toLowerCase().replace(/\s+/g, '');
    const enNorm = (picked.en || '').toLowerCase();
    const core = zhNorm.split('(')[0].split('（')[0];
    const partsSplit = core.split(/[／/・]/).filter(s => s.length >= 2);
    const isCorrect =
      raw === zhNorm || raw === core ||
      (raw.length >= 2 && (zhNorm.includes(raw) || enNorm.includes(raw))) ||
      partsSplit.some(tok => raw.includes(tok));
    if (isCorrect) { QUIZ_STATE.score++; QUIZ_STATE.streak++; SOUND.playRight(); }
    else { QUIZ_STATE.streak = 0; SOUND.playWrong(); }
    finishQuestion(isCorrect, false);
  };

  hintBtn.onclick = () => {
    const hb = $('quiz-hint-box');
    hb.style.display = 'block';
    hb.innerHTML = `分區：<strong>${picked.grp}</strong>｜英文開頭：<strong>${(picked.en || '').slice(0, 3)}…</strong>`;
  };
  revealBtn.onclick = () => {
    if (QUIZ_STATE.revealed) return;
    QUIZ_STATE.total++;
    QUIZ_STATE.streak = 0;
    SOUND.playWrong();
    finishQuestion(false, true);
  };
  submitBtn.onclick = checkAns;
  inputEl.onkeydown = e => { if (e.key === 'Enter') checkAns(); };
  inputEl.focus();
}

/* =========================================================
   主系統初始化與事件管理
   ========================================================= */
function init() {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  cvBox.insertBefore(renderer.domElement, cvBox.firstChild);

  scene3 = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(40, cvBox.clientWidth / cvBox.clientHeight, 0.1, 500);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.autoRotateSpeed = 1.2;

  // 柔和光照系統
  scene3.add(new THREE.HemisphereLight(0xfff5ea, 0x1f2937, 0.65));
  keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
  keyLight.position.set(15, 25, 20);
  scene3.add(keyLight);
  const fillLight = new THREE.DirectionalLight(0x7dd3fc, 0.55);
  fillLight.position.set(-15, 10, -15);
  scene3.add(fillLight);

  window.addEventListener('resize', resize);
  resize();

  // 構建頂端頁籤
  const tabs = $('tabs');
  SCENES.forEach((s, i) => {
    const b = document.createElement('div');
    b.className = 'tab';
    b.textContent = s.name;
    b.onclick = () => loadScene(i);
    tabs.appendChild(b);
  });

  // 控制項綁定
  $('lm').onchange = refresh;
  $('iso').onchange = refresh;
  $('xray').onchange = () => { XRAY = $('xray').checked; refresh(); };
  $('rot').onchange = () => controls.autoRotate = $('rot').checked;
  $('reset').onclick = resetCam;
  $('wbtn').onclick = () => { document.body.classList.toggle('wide'); resize(); };
  const closeDrawers = () => {
    document.body.classList.remove('open-left', 'open-right');
    if ($('mleft')) $('mleft').classList.remove('on');
    if ($('mright')) $('mright').classList.remove('on');
  };
  if ($('mleft')) $('mleft').onclick = () => {
    const on = !document.body.classList.contains('open-left');
    closeDrawers();
    if (on) { document.body.classList.add('open-left'); $('mleft').classList.add('on'); }
  };
  if ($('mright')) $('mright').onclick = () => {
    const on = !document.body.classList.contains('open-right');
    closeDrawers();
    if (on) { document.body.classList.add('open-right'); $('mright').classList.add('on'); }
  };
  if ($('drawer-backdrop')) $('drawer-backdrop').onclick = closeDrawers;
  if ($('psearch')) $('psearch').addEventListener('input', () => {
    const q = $('psearch').value.trim().toLowerCase();
    document.querySelectorAll('#plist .row').forEach(r => {
      const text = (r.dataset.search || r.textContent || '').toLowerCase();
      r.style.display = (!q || text.includes(q)) ? '' : 'none';
    });
  });
  $('showall').onclick = () => {
    CUR.parts.forEach(p => p.visible = true);
    rebuildList();
    refresh();
    SOUND.playClick();
  };

  // 3D 射線點選與懸停提示
  const ray = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  let downPos = null;
  const canvasEl = renderer.domElement;

  function pick(ev) {
    if (!CUR.root) return null;
    const r = canvasEl.getBoundingClientRect();
    mouse.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(mouse, camera);
    const hits = ray.intersectObjects(CUR.root.children, true)
      .filter(h => h.object.userData.part && h.object.userData.part.visible && h.object.visible);
    if (!hits.length) return null;
    // 孤立模式下其餘構造已淡化成半透明，點擊應穿透它們，優先選到目前高亮的構造
    if ($('iso').checked && selected) {
      const h = hits.find(h => h.object.userData.part === selected);
      if (h) return selected;
    }
    return hits[0].object.userData.part;
  }

  canvasEl.addEventListener('pointerdown', e => downPos = [e.clientX, e.clientY]);
  canvasEl.addEventListener('pointerup', e => {
    if (downPos && Math.hypot(e.clientX - downPos[0], e.clientY - downPos[1]) < 6) {
      const p = pick(e);
      select(p);
      SOUND.playClick();
    }
    downPos = null;
  });

  let lastMove = 0;
  canvasEl.addEventListener('pointermove', e => {
    if (e.buttons || (QUIZ_STATE.active && !QUIZ_STATE.revealed)) { $('tip').style.display = 'none'; return; }
    const now = performance.now();
    if (now - lastMove < 50) return;
    lastMove = now;
    const p = pick(e), t = $('tip');
    if (p) {
      t.innerHTML = `<strong>${p.zh}</strong><br><small style="color:#93c5fd;">${p.latin || p.en}</small>`;
      t.style.display = 'block';
      t.style.left = (e.clientX + 14) + 'px';
      t.style.top = (e.clientY + 14) + 'px';
      canvasEl.style.cursor = 'pointer';
    } else {
      t.style.display = 'none';
      canvasEl.style.cursor = 'default';
    }
  });

  loadScene(0);

  // 動畫主循環
  (function loop() {
    requestAnimationFrame(loop);
    stepFly();
    controls.update();
    if (CUR.tick) CUR.tick();
    renderer.render(scene3, camera);
    updateLabels();
  })();
}

function resize() {
  const w = cvBox.clientWidth, h = cvBox.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

function loadScene(idx) {
  if (CUR.root) {
    scene3.remove(CUR.root);
    CUR.root.traverse(o => {
      if (o.geometry && !o.geometry.userData.shared) o.geometry.dispose();
    });
  }
  curIdx = idx;
  selected = null;
  CUR.parts = [];
  CUR.tick = null;
  fly = null;
  isExploded = false;
  QUIZ_STATE.active = false;
  QUIZ_STATE.revealed = false;

  CUR.root = new THREE.Group();
  scene3.add(CUR.root);

  const sc = SCENES[idx];
  $('extra').innerHTML = '';
  sc.build();

  // 記錄原始材質參數
  CUR.parts.forEach(p => p.meshes.forEach(m => {
    if (m.material) {
      m.material.userData.baseO = m.material.opacity;
      m.material.userData.baseC = m.material.emissive ? m.material.emissive.getHex() : 0;
    }
  }));

  [...$('tabs').children].forEach((t, k) => t.classList.toggle('on', k === idx));
  $('desc-title').textContent = sc.title; $('desc').innerHTML = sc.desc; if ($('psearch')) $('psearch').value = '';

  if (sc.controls) {
    sc.controls.forEach(c => {
      const b = document.createElement('button');
      b.textContent = c.label;
      b.onclick = c.fn;
      $('extra').appendChild(b);
    });
  }

  $('info').innerHTML = '<div class="hint">👆 點擊 3D 模型機構／標籤，即可查看解剖名稱與功能。<br>左鍵拖曳旋轉、滾輪縮放、右鍵平移。</div>';

  // 構建浮動標籤與引線
  $('labels').innerHTML = '';
  $('svg').innerHTML = '';
  labelEls = [];

  CUR.parts.forEach(p => {
    const d = document.createElement('div');
    d.className = 'lab';
    d.innerHTML = p.zh + '<small>' + (p.latin || p.en) + '</small>';
    d.onclick = () => { select(p); SOUND.playClick(); };
    $('labels').appendChild(d);

    const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    ln.setAttribute('stroke', '#7fb6e8');
    ln.setAttribute('stroke-width', '1');
    ln.setAttribute('stroke-opacity', '0.75');
    $('svg').appendChild(ln);

    labelEls.push({ p, d, ln });
  });

  rebuildList();
  resetCam();
  refresh();
}

function resetCam() {
  fly = null;
  const c = SCENES[curIdx].camera;
  camera.position.set(...c.pos);
  controls.target.set(...c.target);
  controls.update();
}

function flyTo(pos, target, ms = 700) {
  fly = {
    p0: camera.position.clone(),
    t0: controls.target.clone(),
    p1: V(...pos),
    t1: V(...target),
    s: performance.now(),
    ms
  };
}

function stepFly() {
  if (!fly) return;
  let k = Math.min(1, (performance.now() - fly.s) / fly.ms);
  k = k * k * (3 - 2 * k); // Smooth ease
  camera.position.lerpVectors(fly.p0, fly.p1, k);
  controls.target.lerpVectors(fly.t0, fly.t1, k);
  if (k >= 1) fly = null;
}

function rebuildList() {
  const box = $('plist');
  box.innerHTML = '';
  let lastG = null;

  CUR.parts.forEach(p => {
    if (p.grp !== lastG) {
      const g = document.createElement('div');
      g.className = 'grp';
      g.textContent = p.grp;
      box.appendChild(g);
      lastG = p.grp;
    }

    const r = document.createElement('div');
    r.className = 'row';
    r.dataset.search = [p.zh, p.en, p.latin, p.grp].join(' ');
    p.row = r;

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = p.visible;
    cb.onclick = e => {
      e.stopPropagation();
      p.visible = cb.checked;
      refresh();
    };

    const sw = document.createElement('div');
    sw.className = 'sw';
    const m = p.meshes[0];
    const hex = (m && m.material && m.material.userData.hex !== undefined)
      ? m.material.userData.hex
      : (m && m.material && m.material.color ? m.material.color.getHex() : 0xe2d9cc);
    sw.style.background = '#' + hex.toString(16).padStart(6, '0');

    const n = document.createElement('span');
    n.className = 'n';
    n.textContent = p.zh;

    r.append(cb, sw, n);
    r.onclick = () => { select(p); SOUND.playClick(); };
    box.appendChild(r);
  });
}

function select(p) {
  selected = p;
  if (p) {
    if (!QUIZ_STATE.active) {
      $('info').innerHTML = `
        <h3>${p.zh}</h3>
        <div class="en">${p.en} ${p.latin ? '(' + p.latin + ')' : ''}</div>
        <span class="g">${p.grp}</span>
        <div class="t">${p.desc}</div>
        ${p.clinical ? `<div class="clinical">💡 <strong>獸醫臨床重點：</strong>${p.clinical}</div>` : ''}
      `;
    }
    if (!p.visible) {
      p.visible = true;
      rebuildList();
    }

  }
  refresh();
}

function refresh() {
  const iso = $('iso').checked;
  CUR.parts.forEach(p => {
    p.meshes.forEach(m => {
      if (!m.material) return;
      m.visible = p.visible;
      const baseO = (XRAY && p.wall) ? 0.36 : ((!XRAY && p.wall) ? p.wallO : m.material.userData.baseO);
      const isSel = (p === selected);

      if (m.material.emissive) {
        m.material.emissive.setHex(isSel ? 0x663300 : m.material.userData.baseC);
      }

      if (iso && selected && !isSel) {
        m.material.transparent = true;
        m.material.opacity = Math.min(baseO, 0.12);
        m.material.depthWrite = false;
      } else {
        m.material.opacity = baseO;
        m.material.transparent = baseO < 1;
        m.material.depthWrite = baseO >= 0.9;
      }
    });

    if (p.row) {
      p.row.classList.toggle('sel', p === selected);
      if (p.row.firstChild) p.row.firstChild.checked = p.visible;
    }
  });
}

const _v = new THREE.Vector3();

// 錨點：取構造包圍盒（朝鏡頭面）中心後吸附到最近的表面三角形（避免 C 形胃、螺旋結腸等中心落在器官外），
// 以 mesh 局部座標保存，每幀依 matrixWorld 換算，縮放／爆炸分解後仍能對準
function resolveAnchor(p) {
  if (!p.meshes.length) return;
  if (!p._anc) {
    CUR.root.updateMatrixWorld(true);
    const bb = new THREE.Box3();
    const src = p.anchorMeshes || p.meshes;
    src.forEach(m => bb.expandByObject(m));
    if (bb.isEmpty()) return;
    // 目標點取包圍盒朝鏡頭（+Z）那一面的中心，讓錨點落在看得見的表面上
    const c = bb.getCenter(new THREE.Vector3());
    c.z = bb.max.z;
    // anchorAt 可改取頂端／底端（如胸椎棘突頂、胸骨腹側），避開被其他骨骼遮住的位置
    if (p.anchorAt === 'top') c.y = bb.max.y;
    else if (p.anchorAt === 'bottom') c.y = bb.min.y;
    const t = new THREE.Vector3();
    let best = Infinity, bestMesh = null, bestLocal = null;
    // 取最近的三角形中心（而非頂點），錨點才會落在面內、不會卡在輪廓邊緣點不到
    const a = new THREE.Vector3(), b = new THREE.Vector3(), cc = new THREE.Vector3();
    src.forEach(m => {
      const geo = m.geometry, pos = geo && geo.attributes.position;
      if (!pos) return;
      const idx = geo.index, nTri = (idx ? idx.count : pos.count) / 3;
      const step = Math.max(1, Math.floor(nTri / 20000));
      const vi = k => idx ? idx.getX(k) : k;
      for (let f = 0; f < nTri; f += step) {
        a.fromBufferAttribute(pos, vi(f * 3));
        b.fromBufferAttribute(pos, vi(f * 3 + 1));
        cc.fromBufferAttribute(pos, vi(f * 3 + 2));
        a.add(b).add(cc).multiplyScalar(1 / 3);
        t.copy(a).applyMatrix4(m.matrixWorld);
        const d = t.distanceToSquared(c);
        if (d < best) { best = d; bestMesh = m; bestLocal = a.clone(); }
      }
    });
    if (!bestMesh) return;
    p._anc = { mesh: bestMesh, local: bestLocal };
  }
  p.anchor.copy(p._anc.local).applyMatrix4(p._anc.mesh.matrixWorld);
}

function updateLabels() {
  const w = cvBox.clientWidth, h = cvBox.clientHeight;
  const mode = $('lm').value;
  const items = [];

  labelEls.forEach(L => {
    const p = L.p;
    let show = false;
    if (QUIZ_STATE.active && !QUIZ_STATE.revealed) {
      show = false;
    } else if (QUIZ_STATE.active && QUIZ_STATE.revealed) {
      show = p.visible && (p === selected);
    } else if (p.visible) {
      show = (mode === 'all') || (mode === 'sel' && p === selected) || (mode === 'key' && (p.isKey || p === selected));
    }
    if (show && p.anchor) {
      resolveAnchor(p);
      _v.copy(p.anchor).project(camera);
      if (_v.z > 1) {
        show = false;
      } else {
        L.s = { x: (_v.x * 0.5 + 0.5) * w, y: (-_v.y * 0.5 + 0.5) * h };
      }
    } else {
      show = false;
    }

    L.show = show;
    L.d.style.display = show ? 'block' : 'none';
    L.ln.style.display = show ? 'block' : 'none';
    L.d.classList.toggle('sel', p === selected);
    if (show) items.push(L);
  });

  if (items.length === 0) return;

  // 左右兩欄平衡排列 (防止文字標籤重疊)
  const cols = {
    L: items.filter(L => L.s.x < w / 2),
    R: items.filter(L => L.s.x >= w / 2)
  };
  while (cols.L.length - cols.R.length > 2) {
    cols.L.sort((a, b) => a.s.x - b.s.x);
    cols.R.push(cols.L.pop());
  }
  while (cols.R.length - cols.L.length > 2) {
    cols.R.sort((a, b) => a.s.x - b.s.x);
    cols.L.push(cols.R.shift());
  }

  const useCompact = items.length > 14 || h < 680;
  items.forEach(L => L.d.classList.toggle('compact', useCompact));

  ['L', 'R'].forEach(side => {
    const col = cols[side].sort((a, b) => a.s.y - b.s.y);
    if (!col.length) return;
    const heights = col.map(L => (L.d.offsetHeight || (useCompact ? 20 : 32)) + 3);
    const totalH = heights.reduce((a, b) => a + b, 0);
    const availH = Math.max(40, h - 16);
    const scaleStep = totalH > availH ? (availH / totalH) : 1;

    let prevBottom = 8;
    col.forEach((L, idx) => {
      const stepH = heights[idx] * scaleStep;
      const ideal = L.s.y - stepH * 0.5;
      L.y = Math.max(prevBottom, ideal);
      prevBottom = L.y + stepH;
    });
    let nextTop = h - 8;
    for (let i = col.length - 1; i >= 0; i--) {
      const stepH = heights[i] * scaleStep;
      col[i].y = Math.max(6, Math.min(col[i].y, nextTop - stepH));
      nextTop = col[i].y;
    }
    col.forEach((L, idx) => {
      const lw = L.d.offsetWidth || 110;
      const lh = L.d.offsetHeight || 20;
      const x = (side === 'L') ? 8 : (w - lw - 8);
      L.d.style.left = x + 'px';
      L.d.style.top = L.y + 'px';
      L.ln.setAttribute('x1', L.s.x);
      L.ln.setAttribute('y1', L.s.y);
      L.ln.setAttribute('x2', (side === 'L') ? (x + lw) : x);
      L.ln.setAttribute('y2', L.y + lh * 0.5);
    });
  });
}

try {
  init();
} catch (e) {
  $('err').textContent = '初始化失敗：' + e.message;
  $('err').style.display = 'block';
  console.error(e);
}
