<script>
/**
 * 獸醫解剖 3D 核心應用程式
 * 整合：馬骨骼系統、狗主要內臟器官、豬特徵消化與實質器官
 */

const $ = id => document.getElementById(id);
const cvBox = $('cv');
const SCENES = [];
const CUR = { parts: [], root: null, tick: null };
let renderer, scene3, camera, controls, curIdx = -1, selected = null, labelEls = [], keyLight, XRAY = false, fly = null;

// 音效引擎
class SoundEngine {
  constructor() { this.ctx = null; }
  init() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  }
  playClick() {
    this.init(); if (!this.ctx) return;
    const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
    osc.type = 'sine'; osc.frequency.setValueAtTime(800, this.ctx.currentTime);
    g.gain.setValueAtTime(0.08, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.06);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.07);
  }
  playRight() {
    this.init(); if (!this.ctx) return;
    const now = this.ctx.currentTime;
    [523.25, 659.25, 783.99].forEach((f, idx) => {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = 'triangle'; o.frequency.setValueAtTime(f, now + idx * 0.08);
      g.gain.setValueAtTime(0.12, now + idx * 0.08);
      g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.25);
      o.connect(g); g.connect(this.ctx.destination);
      o.start(now + idx * 0.08); o.stop(now + idx * 0.08 + 0.26);
    });
  }
  playWrong() {
    this.init(); if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(220, this.ctx.currentTime);
    o.frequency.linearRampToValueAtTime(146.8, this.ctx.currentTime + 0.25);
    g.gain.setValueAtTime(0.15, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.28);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + 0.29);
  }
}
const SOUND = new SoundEngine();

// 向量與輔助
const V = (x, y, z) => new THREE.Vector3(x, y, z);

// 簡單 OBJ パーサー (OBJLoader CDN がオフラインの場合のフォールバック)
function parseOBJFallback(text) {
  const lines = text.split('\n');
  const group = new THREE.Group();
  const positions = [];
  let curMeshName = 'default';
  let curIndices = [];
  let curVertices = [];

  function commitMesh() {
    if (curVertices.length === 0) return;
    const geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.Float32BufferAttribute(curVertices, 3));
    geom.computeVertexNormals();
    const mesh = new THREE.Mesh(geom, new THREE.MeshLambertMaterial({ color: 0xddccbb }));
    mesh.name = curMeshName;
    group.add(mesh);
    curVertices = [];
  }

  for (let i = 0; i < lines.length; i++) {
    const l = lines[i].trim();
    if (!l || l.startsWith('#')) continue;
    const parts = l.split(/\s+/);
    if (parts[0] === 'v') {
      positions.push([parseFloat(parts[1]), parseFloat(parts[2]), parseFloat(parts[3])]);
    } else if (parts[0] === 'o' || parts[0] === 'g') {
      commitMesh();
      curMeshName = parts[1] || 'obj_' + group.children.length;
    } else if (parts[0] === 'f') {
      const vIndices = [];
      for (let j = 1; j < parts.length; j++) {
        const seg = parts[j].split('/')[0];
        vIndices.push(parseInt(seg, 10) - 1);
      }
      for (let j = 1; j < vIndices.length - 1; j++) {
        const i0 = vIndices[0], i1 = vIndices[j], i2 = vIndices[j + 1];
        if (positions[i0] && positions[i1] && positions[i2]) {
          curVertices.push(...positions[i0], ...positions[i1], ...positions[i2]);
        }
      }
    }
  }
  commitMesh();
  return group;
}

function loadOBJString(text) {
  if (typeof THREE.OBJLoader !== 'undefined') {
    try {
      const loader = new THREE.OBJLoader();
      return loader.parse(text);
    } catch(e) {
      console.warn("OBJLoader parse error, using fallback parser:", e);
    }
  }
  return parseOBJFallback(text);
}

// 註冊構造物件到 CUR.parts
function regPart(data) {
  // data: { id, zh, en, latin, grp, desc, clinical, meshes, anchor, anchorMeshes, anchorAt, visible, wall, wallO }
  const p = {
    id: data.id || ('part_' + CUR.parts.length),
    zh: data.zh,
    en: data.en || '',
    latin: data.latin || '',
    grp: data.grp || '一般構造',
    desc: data.desc || '',
    clinical: data.clinical || '',
    meshes: data.meshes || [],
    anchor: data.anchor || new THREE.Vector3(),
    anchorMeshes: data.anchorMeshes || null,
    anchorAt: data.anchorAt || null,
    visible: data.visible !== undefined ? data.visible : true,
    wall: !!data.wall,
    wallO: data.wallO || 0.95
  };
  p.meshes.forEach(m => {
    m.userData.part = p;
    if (m.material) {
      m.material.userData.baseO = m.material.opacity;
      m.material.userData.baseC = m.material.emissive ? m.material.emissive.getHex() : 0;
      m.material.userData.hex = m.material.color ? m.material.color.getHex() : 0xffffff;
    }
  });
  CUR.parts.push(p);
  return p;
}

/* =========================================================
   SCENE 定義
   ========================================================= */

// SCENE 1: 馬全身骨骼
SCENES.push({
  name: "(1) 馬全身骨骼",
  title: "馬全身骨骼系統 (Equine Skeleton)",
  desc: `
    馬（<em>Equus caballus</em>）專為長距離高速奔馳特化，體重由單趾（第三指/趾骨）承受。<br>
    <table>
      <tr><th>骨骼分區</th><th>主要骨骼組成</th><th>解剖與臨床特徵</th></tr>
      <tr><td>頭頸部</td><td>頭顱骨、下頜骨、寰椎(C1)、樞椎(C2)、頸椎(C3-C7)</td><td>面脊發達、額上頜竇相通、門齒磨損辨年齡</td></tr>
      <tr><td>軀幹胸廓</td><td>胸椎(T18)、腰椎(L6)、薦骨(S5癒合)、尾椎(Co15-21)、肋骨(18對)</td><td>背腰段剛性高；第1-8為真肋，9-18為假肋</td></tr>
      <tr><td>前肢系統</td><td>肩胛骨、肱骨、橈尺骨、腕骨群、前砲骨(MC3)、副夾骨、指骨(繫/冠/蹄)</td><td>承擔60%體重；懸韌帶與種子骨吸收衝擊；蹄葉炎易致蹄骨旋轉</td></tr>
      <tr><td>後肢系統</td><td>骨盆(髂/坐/恥)、股骨、髕骨、脛腓骨、跟骨(飛節)、後砲骨(MT3)、趾骨</td><td><strong>第三轉子</strong>為馬特徵；膝蓋與飛節形成<strong>站立靜止裝置</strong></td></tr>
    </table>
  `,
  camera: { pos: [0, 0, 70], target: [0, 0, 0] },
  build: function() {
    let root = null;
    if (window.HORSE_OBJ_DATA) {
      root = loadOBJString(window.HORSE_OBJ_DATA);
    }
    if (!root || root.children.length === 0) {
      root = buildFallbackHorse();
    }

    // 原始 OBJ 座標：+Z 朝頭、-Z 朝尾、X 為左右（負值＝左側）
    // 轉 90° 讓馬頭朝 +X，左側面朝向鏡頭（解剖學慣用左側觀）
    if (window.HORSE_OBJ_DATA) root.rotation.y = Math.PI / 2;

    // 正規化尺寸
    const box = new THREE.Box3().setFromObject(root);
    const center = new THREE.Vector3();
    box.getCenter(center);
    const size = new THREE.Vector3();
    box.getSize(size);
    const maxDim = Math.max(size.x, size.y, size.z);
    const scale = 32 / (maxDim || 1);
    root.scale.set(scale, scale, scale);
    root.position.sub(center.clone().multiplyScalar(scale));
    root.position.y += 1.0;
    CUR.root.add(root);

    const boneMat = new THREE.MeshLambertMaterial({ color: 0xe2d9cc });

    // OBJ 內的物件名稱是早期自動分割依座標門檻猜的，許多名稱與實際骨骼不符
    // （例如 pelvis_* 其實是股骨、sacrum_95 是整個骨盆、humerus_130~137 是肋軟骨），
    // 因此這裡逐一依實際位置與形狀指定歸屬；左側（_l / x<0）面向鏡頭，作為標籤錨點
    const R = (pre, a, b) => Array.from({ length: b - a + 1 }, (_, i) => pre + (a + i));

/* =========================================================
   爆炸分解動畫 (Exploded View Animation)
   ========================================================= */
let isExploded = false;
function toggleExplode() {
  isExploded = !isExploded;
  const factor = isExploded ? 1.7 : 1.0;
  CUR.parts.forEach(p => {
    p.meshes.forEach(m => {
      if (!m.userData.origPos) m.userData.origPos = m.position.clone();
      const targetPos = isExploded
        ? m.userData.origPos.clone().multiplyScalar(factor).add(p.anchor.clone().multiplyScalar(0.45))
        : m.userData.origPos.clone();
      flyMesh(m, targetPos, 600);
    });
  });
  SOUND.playClick();
}

function flyMesh(mesh, targetPos, ms = 600) {
  const startPos = mesh.position.clone();
  const startTime = performance.now();
  function step() {
    const elapsed = performance.now() - startTime;
    const t = Math.min(1, elapsed / ms);
    const ease = t * t * (3 - 2 * t);
    mesh.position.lerpVectors(startPos, targetPos, ease);
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function startQuizQuestion() {
  if (CUR.parts.length === 0) return;
  QUIZ_STATE.active = true;
  const validParts = CUR.parts.filter(p => p.visible && p.zh);
  const picked = validParts[Math.floor(Math.random() * validParts.length)];
  QUIZ_STATE.curPart = picked;

  select(picked);
  resolveAnchor(picked);
  if (picked.anchor) {
    flyTo(
      [picked.anchor.x + 4, picked.anchor.y + 2, picked.anchor.z + 12],
      [picked.anchor.x, picked.anchor.y, picked.anchor.z],
      600
    );
  }

  // 渲染右側測驗 Widget
  $('info').innerHTML = `
    <div class="quiz-widget">
      <span class="quiz-badge">🎯 解剖隨機抽考</span>
      <div style="font-size:12px; color:#93c5fd;">已聚焦鎖定 3D 模型中高亮閃爍之部位：</div>
      <div class="quiz-prompt">請輸入此解剖構造的<strong>中文名稱</strong>：</div>
      <div class="quiz-row">
        <input type="text" class="quiz-input" id="quiz-ans" placeholder="輸入名稱 (如: 股骨、盲腸...)" autofocus />
        <button id="quiz-sub" style="background:#2563eb; color:#fff; padding:6px 14px; border:none; border-radius:4px; cursor:pointer; font-weight:700;">提交</button>
      </div>
      <div id="quiz-feedback"></div>
      <div style="margin-top:10px; font-size:12px; color:#9ca3af;">
        統計：答對 <strong>${QUIZ_STATE.score}</strong> / <strong>${QUIZ_STATE.total}</strong> 題 ｜ 🔥 連續答對：<strong>${QUIZ_STATE.streak}</strong>
      </div>
    </div>
  `;

  const inputEl = $('quiz-ans');
  const submitBtn = $('quiz-sub');

  const checkAns = () => {
    const val = inputEl.value.trim().toLowerCase();
    if (!val) return;
    QUIZ_STATE.total++;
    const fb = $('quiz-feedback');
    const targetName = picked.zh.toLowerCase();
    const isCorrect = val === targetName || targetName.includes(val) || val.includes(targetName.split(' ')[0]);

    if (isCorrect) {
      QUIZ_STATE.score++;
      QUIZ_STATE.streak++;
      SOUND.playRight();
      fb.className = "quiz-res ok";
      fb.innerHTML = `🎉 <strong>答對了！</strong><br>此構造為：<strong>${picked.zh}</strong><br><small>${picked.en} (${picked.latin})</small><br>${picked.desc}`;
    } else {
      QUIZ_STATE.streak = 0;
      SOUND.playWrong();
      fb.className = "quiz-res err";
      fb.innerHTML = `❌ <strong>再接再厲！</strong><br>正確答案為：<strong>${picked.zh}</strong><br><small>${picked.en} (${picked.latin})</small><br>${picked.desc}`;
    }
    inputEl.disabled = true;
    submitBtn.textContent = "下一題 ▶";
    submitBtn.style.background = "#059669";
    submitBtn.onclick = () => startQuizQuestion();
  };

  submitBtn.onclick = checkAns;
  inputEl.onkeydown = e => { if (e.key === 'Enter') checkAns(); };
  inputEl.focus();
}

/* =========================================================
   主系統初始化與事件管理
   ========================================================= */
function init() {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  cvBox.insertBefore(renderer.domElement, cvBox.firstChild);

  scene3 = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(40, cvBox.clientWidth / cvBox.clientHeight, 0.1, 500);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.autoRotateSpeed = 1.2;

  // 柔和光照系統
  scene3.add(new THREE.HemisphereLight(0xfff5ea, 0x1f2937, 0.65));
  keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
  keyLight.position.set(15, 25, 20);
  scene3.add(keyLight);
  const fillLight = new THREE.DirectionalLight(0x7dd3fc, 0.55);
  fillLight.position.set(-15, 10, -15);
  scene3.add(fillLight);

  window.addEventListener('resize', resize);
  resize();

  // 構建頂端頁籤
  const tabs = $('tabs');
  SCENES.forEach((s, i) => {
    const b = document.createElement('div');
    b.className = 'tab';
    b.textContent = s.name;
    b.onclick = () => loadScene(i);
    tabs.appendChild(b);
  });

  // 控制項綁定
  $('lm').onchange = refresh;
  $('iso').onchange = refresh;
  $('xray').onchange = () => { XRAY = $('xray').checked; refresh(); };
  $('rot').onchange = () => controls.autoRotate = $('rot').checked;
  $('reset').onclick = resetCam;
  $('wbtn').onclick = () => { document.body.classList.toggle('wide'); resize(); };
  $('showall').onclick = () => {
    CUR.parts.forEach(p => p.visible = true);
    rebuildList();
    refresh();
    SOUND.playClick();
  };

  // 3D 射線點選與懸停提示
  const ray = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  let downPos = null;
  const canvasEl = renderer.domElement;

  function pick(ev) {
    if (!CUR.root) return null;
    const r = canvasEl.getBoundingClientRect();
    mouse.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(mouse, camera);
    const hits = ray.intersectObjects(CUR.root.children, true)
      .filter(h => h.object.userData.part && h.object.userData.part.visible && h.object.visible);
    if (!hits.length) return null;
    // 孤立模式下其餘構造已淡化成半透明，點擊應穿透它們，優先選到目前高亮的構造
    if ($('iso').checked && selected) {
      const h = hits.find(h => h.object.userData.part === selected);
      if (h) return selected;
    }
    return hits[0].object.userData.part;
  }

  canvasEl.addEventListener('pointerdown', e => downPos = [e.clientX, e.clientY]);
  canvasEl.addEventListener('pointerup', e => {
    if (downPos && Math.hypot(e.clientX - downPos[0], e.clientY - downPos[1]) < 6) {
      const p = pick(e);
      select(p);
      SOUND.playClick();
    }
    downPos = null;
  });

  let lastMove = 0;
  canvasEl.addEventListener('pointermove', e => {
    if (e.buttons) { $('tip').style.display = 'none'; return; }
    const now = performance.now();
    if (now - lastMove < 50) return;
    lastMove = now;
    const p = pick(e), t = $('tip');
    if (p) {
      t.innerHTML = `<strong>${p.zh}</strong><br><small style="color:#93c5fd;">${p.latin || p.en}</small>`;
      t.style.display = 'block';
      t.style.left = (e.clientX + 14) + 'px';
      t.style.top = (e.clientY + 14) + 'px';
      canvasEl.style.cursor = 'pointer';
    } else {
      t.style.display = 'none';
      canvasEl.style.cursor = 'default';
    }
  });

  loadScene(0);

  // 動畫主循環
  (function loop() {
    requestAnimationFrame(loop);
    stepFly();
    controls.update();
    if (CUR.tick) CUR.tick();
    renderer.render(scene3, camera);
    updateLabels();
  })();
}

function resize() {
  const w = cvBox.clientWidth, h = cvBox.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

function loadScene(idx) {
  if (CUR.root) {
    scene3.remove(CUR.root);
    CUR.root.traverse(o => {
      if (o.geometry && !o.geometry.userData.shared) o.geometry.dispose();
    });
  }
  curIdx = idx;
  selected = null;
  CUR.parts = [];
  CUR.tick = null;
  fly = null;
  isExploded = false;
  QUIZ_STATE.active = false;

  CUR.root = new THREE.Group();
  scene3.add(CUR.root);

  const sc = SCENES[idx];
  $('extra').innerHTML = '';
  sc.build();

  // 記錄原始材質參數
  CUR.parts.forEach(p => p.meshes.forEach(m => {
    if (m.material) {
      m.material.userData.baseO = m.material.opacity;
      m.material.userData.baseC = m.material.emissive ? m.material.emissive.getHex() : 0;
    }
  }));

  [...$('tabs').children].forEach((t, k) => t.classList.toggle('on', k === idx));
  $('desc').innerHTML = '<h2>' + sc.title + '</h2>' + sc.desc;

  if (sc.controls) {
    sc.controls.forEach(c => {
      const b = document.createElement('button');
      b.textContent = c.label;
      b.onclick = c.fn;
      $('extra').appendChild(b);
    });
  }

  $('info').innerHTML = '<div class="hint">👆 點擊 3D 模型機構／標籤，即可查看解剖名稱與功能。<br>左鍵拖曳旋轉、滾輪縮放、右鍵平移。</div>';

  // 構建浮動標籤與引線
  $('labels').innerHTML = '';
  $('svg').innerHTML = '';
  labelEls = [];

  CUR.parts.forEach(p => {
    const d = document.createElement('div');
    d.className = 'lab';
    d.innerHTML = p.zh + '<small>' + (p.latin || p.en) + '</small>';
    d.onclick = () => { select(p); SOUND.playClick(); };
    $('labels').appendChild(d);

    const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    ln.setAttribute('stroke', '#7fb6e8');
    ln.setAttribute('stroke-width', '1');
    ln.setAttribute('stroke-opacity', '0.75');
    $('svg').appendChild(ln);

    labelEls.push({ p, d, ln });
  });

  rebuildList();
  resetCam();
  refresh();
}

function resetCam() {
  fly = null;
  const c = SCENES[curIdx].camera;
  camera.position.set(...c.pos);
  controls.target.set(...c.target);
  controls.update();
}

function flyTo(pos, target, ms = 700) {
  fly = {
    p0: camera.position.clone(),
    t0: controls.target.clone(),
    p1: V(...pos),
    t1: V(...target),
    s: performance.now(),
    ms
  };
}

function stepFly() {
  if (!fly) return;
  let k = Math.min(1, (performance.now() - fly.s) / fly.ms);
  k = k * k * (3 - 2 * k); // Smooth ease
  camera.position.lerpVectors(fly.p0, fly.p1, k);
  controls.target.lerpVectors(fly.t0, fly.t1, k);
  if (k >= 1) fly = null;
}

function rebuildList() {
  const box = $('plist');
  box.innerHTML = '';
  let lastG = null;

  CUR.parts.forEach(p => {
    if (p.grp !== lastG) {
      const g = document.createElement('div');
      g.className = 'grp';
      g.textContent = p.grp;
      box.appendChild(g);
      lastG = p.grp;
    }

    const r = document.createElement('div');
    r.className = 'row';
    p.row = r;

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = p.visible;
    cb.onclick = e => {
      e.stopPropagation();
      p.visible = cb.checked;
      refresh();
    };

    const sw = document.createElement('div');
    sw.className = 'sw';
    const m = p.meshes[0];
    const hex = (m && m.material && m.material.userData.hex !== undefined)
      ? m.material.userData.hex
      : (m && m.material && m.material.color ? m.material.color.getHex() : 0xe2d9cc);
    sw.style.background = '#' + hex.toString(16).padStart(6, '0');

    const n = document.createElement('span');
    n.className = 'n';
    n.textContent = p.zh;

    r.append(cb, sw, n);
    r.onclick = () => { select(p); SOUND.playClick(); };
    box.appendChild(r);
  });
}

function select(p) {
  selected = p;
  if (p) {
    if (!QUIZ_STATE.active) {
      $('info').innerHTML = `
        <h3>${p.zh}</h3>
        <div class="en">${p.en} ${p.latin ? '(' + p.latin + ')' : ''}</div>
        <span class="g">${p.grp}</span>
        <div class="t">${p.desc}</div>
        ${p.clinical ? `<div class="clinical">💡 <strong>獸醫臨床重點：</strong>${p.clinical}</div>` : ''}
      `;
    }
    if (!p.visible) {
      p.visible = true;
      rebuildList();
    }
    if (p.wall && !XRAY) {
      XRAY = true;
      $('xray').checked = true;
    }
  }
  refresh();
}

function refresh() {
  const iso = $('iso').checked;
  CUR.parts.forEach(p => {
    p.meshes.forEach(m => {
      if (!m.material) return;
      m.visible = p.visible;
      const baseO = (!XRAY && p.wall) ? p.wallO : m.material.userData.baseO;
      const isSel = (p === selected);

      if (m.material.emissive) {
        m.material.emissive.setHex(isSel ? 0x663300 : m.material.userData.baseC);
      }

      if (iso && selected && !isSel) {
        m.material.transparent = true;
        m.material.opacity = Math.min(baseO, 0.12);
        m.material.depthWrite = false;
      } else {
        m.material.opacity = baseO;
        m.material.transparent = baseO < 1;
        m.material.depthWrite = baseO >= 0.9;
      }
    });

    if (p.row) {
      p.row.classList.toggle('sel', p === selected);
      if (p.row.firstChild) p.row.firstChild.checked = p.visible;
    }
  });
}

const _v = new THREE.Vector3();

// 錨點：取構造包圍盒（朝鏡頭面）中心後吸附到最近的表面三角形（避免 C 形胃、螺旋結腸等中心落在器官外），
// 以 mesh 局部座標保存，每幀依 matrixWorld 換算，縮放／爆炸分解後仍能對準
function resolveAnchor(p) {
  if (!p.meshes.length) return;
  if (!p._anc) {
    CUR.root.updateMatrixWorld(true);
    const bb = new THREE.Box3();
    const src = p.anchorMeshes || p.meshes;
    src.forEach(m => bb.expandByObject(m));
    if (bb.isEmpty()) return;
    // 目標點取包圍盒朝鏡頭（+Z）那一面的中心，讓錨點落在看得見的表面上
    const c = bb.getCenter(new THREE.Vector3());
    c.z = bb.max.z;
    // anchorAt 可改取頂端／底端（如胸椎棘突頂、胸骨腹側），避開被其他骨骼遮住的位置
    if (p.anchorAt === 'top') c.y = bb.max.y;
    else if (p.anchorAt === 'bottom') c.y = bb.min.y;
    const t = new THREE.Vector3();
    let best = Infinity, bestMesh = null, bestLocal = null;
    // 取最近的三角形中心（而非頂點），錨點才會落在面內、不會卡在輪廓邊緣點不到
    const a = new THREE.Vector3(), b = new THREE.Vector3(), cc = new THREE.Vector3();
    src.forEach(m => {
      const geo = m.geometry, pos = geo && geo.attributes.position;
      if (!pos) return;
      const idx = geo.index, nTri = (idx ? idx.count : pos.count) / 3;
      const step = Math.max(1, Math.floor(nTri / 20000));
      const vi = k => idx ? idx.getX(k) : k;
      for (let f = 0; f < nTri; f += step) {
        a.fromBufferAttribute(pos, vi(f * 3));
        b.fromBufferAttribute(pos, vi(f * 3 + 1));
        cc.fromBufferAttribute(pos, vi(f * 3 + 2));
        a.add(b).add(cc).multiplyScalar(1 / 3);
        t.copy(a).applyMatrix4(m.matrixWorld);
        const d = t.distanceToSquared(c);
        if (d < best) { best = d; bestMesh = m; bestLocal = a.clone(); }
      }
    });
    if (!bestMesh) return;
    p._anc = { mesh: bestMesh, local: bestLocal };
  }
  p.anchor.copy(p._anc.local).applyMatrix4(p._anc.mesh.matrixWorld);
}

function updateLabels() {
  const w = cvBox.clientWidth, h = cvBox.clientHeight;
  const mode = $('lm').value;
  const items = [];

  labelEls.forEach(L => {
    const p = L.p;
    let show = p.visible && (mode === 'all' || (mode === 'sel' && p === selected));
    if (show && p.anchor) {
      resolveAnchor(p);
      _v.copy(p.anchor).project(camera);
      if (_v.z > 1) {
        show = false;
      } else {
        L.s = { x: (_v.x * 0.5 + 0.5) * w, y: (-_v.y * 0.5 + 0.5) * h };
      }
    } else {
      show = false;
    }

    L.show = show;
    L.d.style.display = show ? 'block' : 'none';
    L.ln.style.display = show ? 'block' : 'none';
    L.d.classList.toggle('sel', p === selected);
    if (show) items.push(L);
  });

  if (items.length === 0) return;

  // 左右兩欄平衡排列 (防止文字標籤重疊)
  const cols = {
    L: items.filter(L => L.s.x < w / 2),
    R: items.filter(L => L.s.x >= w / 2)
  };
  while (cols.L.length - cols.R.length > 2) {
    cols.L.sort((a, b) => a.s.x - b.s.x);
    cols.R.push(cols.L.pop());
  }
  while (cols.R.length - cols.L.length > 2) {
    cols.R.sort((a, b) => a.s.x - b.s.x);
    cols.L.push(cols.R.shift());
  }

  const GAP = Math.min(28, (h - 20) / Math.max(1, cols.L.length, cols.R.length));

  ['L', 'R'].forEach(side => {
    const col = cols[side].sort((a, b) => a.s.y - b.s.y);
    let prev = -1e9;
    col.forEach(L => {
      L.y = Math.max(8, L.s.y - 14, prev + GAP);
      prev = L.y;
    });
    let next = h - 8;
    for (let i = col.length - 1; i >= 0; i--) {
      col[i].y = Math.min(col[i].y, next - GAP);
      next = col[i].y;
    }
    col.forEach(L => {
      const lw = L.d.offsetWidth || 110;
      const x = (side === 'L') ? 8 : (w - lw - 8);
      L.d.style.left = x + 'px';
      L.d.style.top = L.y + 'px';
      L.ln.setAttribute('x1', L.s.x);
      L.ln.setAttribute('y1', L.s.y);
      L.ln.setAttribute('x2', (side === 'L') ? (x + lw) : x);
      L.ln.setAttribute('y2', L.y + 12);
    });
  });
}

try {
  init();
} catch (e) {
  $('err').textContent = '初始化失敗：' + e.message;
  $('err').style.display = 'block';
  console.error(e);
}
</script>
